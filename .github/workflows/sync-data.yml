name: Sync Platform Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sync script
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BILI_UID: ${{ secrets.BILI_UID }}
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: node sync-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "qingsong-sync-bot"
          git config user.email "qingsong-sync-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skip commit"
          else
            git commit -m "chore: sync platform data $(date -u +'%Y-%m-%d %H:%M')"
            git push origin main
          fi
